name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      # Slim install: the unit tests cover the pure scoring functions in
      # aggregator.py, whose ML imports are guard-wrapped — no torch/opencv/
      # sklearn needed (see backend/requirements-test.txt).
      - name: Install test dependencies
        run: pip install -r backend/requirements-test.txt

      - name: Run unit tests
        run: pytest

  # The extension suite is plain node:test + node:assert — no dependencies,
  # no npm install, so this job needs nothing but a Node runtime.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test extension/tests/*.cjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
